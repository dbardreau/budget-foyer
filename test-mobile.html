<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Test Mobile</title>
<style>
  body{margin:0;background:#111;font-family:sans-serif;color:#ccc;padding:10px}
  .bar{margin-bottom:8px}
  .bar button{padding:6px 10px;margin-right:6px;border-radius:6px;border:1px solid #555;background:#222;color:#eee;cursor:pointer}
  .bar span{color:#999}
  iframe{border:1px solid #555;display:block;background:#0d1117}
</style>
</head>
<body>
<div class="bar">
  <span>Largeur :</span>
  <button onclick="resize(320)">320</button>
  <button onclick="resize(375)">375</button>
  <button onclick="resize(414)">414</button>
  <button onclick="resize(700)">700</button>
  <button onclick="resize(1024)">1024</button>
  <span id="w">375</span> px
</div>
<iframe id="f" src="index.html" width="375" height="780"></iframe>
<script>
  function resize(w){
    document.getElementById('f').width = w;
    document.getElementById('w').textContent = w;
  }
</script>
</body>
</html>
